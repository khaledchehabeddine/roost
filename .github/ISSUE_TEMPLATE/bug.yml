name: Bug
description: Report a defect or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Summary
      description: What went wrong
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Steps, test case, or code snippet to trigger the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should happen instead
    validations:
      required: true
  - type: textarea
    attributes:
      label: Notes
      description: Additional context, links, or edge cases
