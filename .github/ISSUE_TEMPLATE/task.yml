name: Task
description: Feature, fix, chore, or any other unit of work
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Short paragraph summarizing the task
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of concrete, verifiable items
      value: "- [ ] "
    validations:
      required: true
