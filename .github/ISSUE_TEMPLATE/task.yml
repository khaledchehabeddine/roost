name: Task
description: Feature, chore, docs, or any other unit of work
body:
  - type: textarea
    attributes:
      label: Description
      description: Short paragraph summarizing the task
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance Criteria
      description: Checklist of concrete, verifiable items
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    attributes:
      label: Notes
      description: Additional context, links, or edge cases
