name: Security
description: Security vulnerability or hardening task
labels: ["security"]
body:
  - type: textarea
    attributes:
      label: Summary
      description: What the vulnerability or security concern is
    validations:
      required: true
  - type: textarea
    attributes:
      label: Impact
      description: What is at risk and how it could be exploited
    validations:
      required: true
  - type: textarea
    attributes:
      label: Location
      description: Crate, file, and/or function where the issue exists
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggested Fix
      description: Proposed approach to address the issue
  - type: textarea
    attributes:
      label: Notes
      description: Additional context, links, or edge cases
