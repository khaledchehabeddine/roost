name: Deny

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  checks: write
  contents: read
  issues: write

jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - uses: EmbarkStudios/cargo-deny-action@v2
