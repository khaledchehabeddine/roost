name: Bindings

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

jobs:
  bindings:
    name: UniFFI Bindings
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build hermes-uniffi
        run: cargo build -p hermes-uniffi

      - name: Generate Kotlin bindings
        run: |
          cargo run --bin uniffi-bindgen -- generate \
            target/debug/libhermes.dylib \
            --language kotlin \
            --out-dir target/bindings/kotlin

      - name: Generate Swift bindings
        run: |
          cargo run --bin uniffi-bindgen-swift -- \
            target/debug/libhermes.dylib \
            target/bindings/swift \
            --swift-sources --headers

      - name: Verify Swift compiles
        run: swiftc -parse target/bindings/swift/*.swift

      - name: Verify Kotlin generated
        run: test -s target/bindings/kotlin/hermes/hermes.kt
