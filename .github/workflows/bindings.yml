name: Bindings

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

jobs:
  bindings:
    name: UniFFI Bindings
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build aether-uniffi
        run: cargo build -p aether-uniffi

      - name: Generate Kotlin Bindings
        run: |
          cargo run --bin uniffi-bindgen -- generate \
            target/debug/libaether.dylib \
            --language kotlin \
            --out-dir target/bindings/kotlin

      - name: Generate Swift Bindings
        run: |
          cargo run --bin uniffi-bindgen-swift -- \
            target/debug/libaether.dylib \
            target/bindings/swift \
            --swift-sources --headers

      - name: Verify Swift Compiles
        run: swiftc -parse target/bindings/swift/*.swift

      # Compilation verification requires Gradle + UniFFI runtime; verify generation only
      - name: Verify Kotlin Generated
        run: test -s target/bindings/kotlin/com/relay/aether/aether.kt
