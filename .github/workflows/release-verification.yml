name: Release Verification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip non-tag release preflight
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "release preflight is tag-only"

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "docs/release-notes/$GITHUB_REF_NAME.md"

      - name: Verify release gates
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release/verify-release-gates.sh

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: scripts/release/sbom.sh

      - name: Resolve Workspace Version
        id: version
        run: |
          pkgid="$(cargo pkgid --manifest-path crates/aether-uniffi/Cargo.toml)"
          echo "version=${pkgid##*#}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aether-uniffi-v${{ steps.version.outputs.version }}-sbom
          path: target/sbom/aether-uniffi-v${{ steps.version.outputs.version }}-sbom.json
          if-no-files-found: error

  constrained-decryption-budget:
    name: Constrained Decryption Budget
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run constrained decryption budget gate
        run: scripts/ci/constrained-decryption-budget.sh

  android-reproducible:
    name: Android Reproducible Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify Android reproducibility
        run: scripts/release/reproducible-mobile-artifacts.sh android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            target/release-verification/reproducible-mobile/android/pass-1/artifacts/**
            target/release-verification/reproducible-mobile/android/pass-1/SHA256SUMS
          if-no-files-found: error

  android-aar-distribution:
    name: Android AAR Distribution
    runs-on: ubuntu-latest
    needs:
      - release-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-36;aosp_atd;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and publish local Android AAR
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/release/android-aar.sh

      - name: Build and publish signed Android AAR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AETHER_ANDROID_SIGN_PUBLICATION: "true"
          AETHER_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AETHER_RELEASE_GPG_PRIVATE_KEY }}
          AETHER_RELEASE_GPG_PASSPHRASE: ${{ secrets.AETHER_RELEASE_GPG_PASSPHRASE }}
        run: scripts/release/android-aar.sh

      - name: Verify negative Android AAR consumer path
        run: scripts/test/android-aar-negative.sh

      - name: Verify Android AAR consumer path
        run: scripts/test/android-aar-consumer.sh

      - name: Upload Android AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aar-distribution
          path: |
            target/android/maven/**
            target/android/central/*.zip
          if-no-files-found: error

  ios-reproducible:
    name: iOS Reproducible Artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify iOS reproducibility
        run: scripts/release/reproducible-mobile-artifacts.sh ios

      - name: Verify iOS package consumer
        run: |
          pkgid="$(cargo pkgid --manifest-path crates/aether-uniffi/Cargo.toml)"
          version="${pkgid##*#}"
          scripts/test/ios-package-consumer.sh "target/release-verification/reproducible-mobile/ios/pass-1/artifacts/aether-ios-v$version"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: |
            target/release-verification/reproducible-mobile/ios/pass-1/artifacts/**
            target/release-verification/reproducible-mobile/ios/pass-1/SHA256SUMS
          if-no-files-found: error

  release-candidate-artifact-verification:
    name: Release Candidate Artifact Verification
    runs-on: ubuntu-latest
    needs:
      - android-reproducible
      - android-aar-distribution
      - ios-reproducible
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-artifacts
          path: target/release-candidate-verification/input/ios

      - name: Download Android release artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: target/release-candidate-verification/input/android

      - name: Verify release-candidate artifact signatures and checksums
        run: |
          scripts/test/release-candidate-artifact-verification.sh \
            target/release-candidate-verification/input/ios \
            target/release-candidate-verification/input/android

      - name: Upload release-candidate verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-artifact-verification
          path: target/release-candidate-verification/evidence/**
          if-no-files-found: error

  signed-release:
    name: Signed Release Artifacts
    runs-on: ubuntu-latest
    needs:
      - release-preflight
      - sbom
      - constrained-decryption-budget
      - android-reproducible
      - android-aar-distribution
      - ios-reproducible
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-artifacts
          path: target/signed-release/ios

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-aar-distribution
          path: target/signed-release/android

      - name: Import release signing key
        env:
          AETHER_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AETHER_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$AETHER_RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "missing AETHER_RELEASE_GPG_PRIVATE_KEY" >&2
            exit 2
          fi

          export GNUPGHOME="$RUNNER_TEMP/aether-release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$AETHER_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign and verify release artifacts
        env:
          AETHER_RELEASE_GPG_FINGERPRINT: ${{ secrets.AETHER_RELEASE_GPG_FINGERPRINT }}
          AETHER_RELEASE_GPG_PASSPHRASE: ${{ secrets.AETHER_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "$AETHER_RELEASE_GPG_FINGERPRINT" ]; then
            echo "missing AETHER_RELEASE_GPG_FINGERPRINT" >&2
            exit 2
          fi
          if [ -z "$AETHER_RELEASE_GPG_PASSPHRASE" ]; then
            echo "missing AETHER_RELEASE_GPG_PASSPHRASE" >&2
            exit 2
          fi
          release_fingerprint="$(printf '%s' "$AETHER_RELEASE_GPG_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"

          one_match() {
            local label="$1"
            shift
            local matches
            local count
            matches="$(mktemp)"
            "$@" | LC_ALL=C sort > "$matches"
            count="$(wc -l < "$matches" | tr -d '[:space:]')"
            if [ "$count" -ne 1 ]; then
              echo "expected exactly one $label, found $count" >&2
              cat "$matches" >&2
              rm -f "$matches"
              exit 1
            fi
            sed -n '1p' "$matches"
            rm -f "$matches"
          }

          version="${GITHUB_REF_NAME#v}"
          ios_zip="$(one_match "iOS release artifact for v$version" \
            find target/signed-release/ios -type f -name "Aether-v$version.xcframework.zip")"
          android_aar="$(one_match "Android AAR artifact for v$version" \
            find target/signed-release/android -type f -path "*/com/aurelion/aether/$version/aether-$version.aar")"
          central_zip="$(one_match "signed Android Maven Central bundle for v$version" \
            find target/signed-release/android -type f -name "aether-$version-maven-central-signed.zip")"

          scripts/release/sign-artifact.sh "$ios_zip"
          scripts/release/sign-artifact.sh "$android_aar"

          public_key="target/signed-release/aether-v$version-release-key.asc"
          gpg --batch --armor --export "$release_fingerprint" > "$public_key"

          AETHER_RELEASE_GPG_FINGERPRINT="$release_fingerprint" \
            scripts/test/release-artifact-verification.sh "$ios_zip" "$android_aar" "$public_key"

          release_assets="target/signed-release/release-assets"
          mkdir -p "$release_assets"
          cp "$ios_zip" "$ios_zip.asc" "$ios_zip.sha256" "$release_assets/"
          cp "$android_aar" "$android_aar.asc" "$android_aar.sha256" "$release_assets/"
          cp "$public_key" "$central_zip" "$release_assets/"

      - name: Verify release gates
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release/verify-release-gates.sh

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: target/signed-release/release-assets/**
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          title="$GITHUB_REF_NAME"
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
            gh release upload "$tag" target/signed-release/release-assets/* --clobber
          else
            gh release create "$tag" target/signed-release/release-assets/* \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi
