name: Release Verification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  AETHER_RELEASE_SOURCE_REVISION: ${{ github.sha }}

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip non-tag release preflight
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "release preflight is tag-only"

      - name: Verify release preflight contract
        run: scripts/test/release-gates.sh

      - name: Verify immutable publication contract
        run: scripts/test/release-publication.sh

      - name: Verify release gates
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release/verify-release-gates.sh

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM
        run: scripts/release/sbom.sh

      - name: Verify reproducible SBOM
        run: scripts/test/sbom-reproducibility.sh

      - name: Record SBOM reproducibility evidence
        run: |
          scripts/release/write-mobile-gate-evidence.sh \
            target/sbom/sbom-reproducibility.evidence \
            sbom-reproducibility

      - name: Resolve Workspace Version
        id: version
        run: |
          pkgid="$(cargo pkgid --manifest-path crates/aether-uniffi/Cargo.toml)"
          echo "version=${pkgid##*#}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aether-uniffi-v${{ steps.version.outputs.version }}-sbom
          path: target/sbom/*
          if-no-files-found: error

  constrained-decryption-budget:
    name: Constrained Decryption Budget
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run constrained decryption budget gate
        run: scripts/ci/constrained-decryption-budget.sh

  android-reproducible:
    name: Android Reproducible Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verify Android reproducibility
        run: scripts/release/reproducible-mobile-artifacts.sh android

      - name: Record Android reproducibility evidence
        run: |
          scripts/release/write-mobile-gate-evidence.sh \
            target/release-verification/reproducible-mobile/android/pass-1/artifacts/android-reproducibility.evidence \
            android-reproducibility

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            target/release-verification/reproducible-mobile/android/pass-1/artifacts/**
            target/release-verification/reproducible-mobile/android/pass-1/SHA256SUMS
          if-no-files-found: error

  android-aar-distribution:
    name: Android AAR Distribution
    runs-on: ubuntu-latest
    needs:
      - release-preflight
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "system-images;android-36;aosp_atd;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and publish local Android AAR
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/release/android-aar.sh

      - name: Build and publish signed Android AAR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AETHER_ANDROID_SIGN_PUBLICATION: "true"
          AETHER_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AETHER_RELEASE_GPG_PRIVATE_KEY }}
          AETHER_RELEASE_GPG_PASSPHRASE: ${{ secrets.AETHER_RELEASE_GPG_PASSPHRASE }}
        run: scripts/release/android-aar.sh

      - name: Verify negative Android AAR consumer path
        run: scripts/test/android-aar-negative.sh

      - name: Verify Android AAR consumer path
        run: scripts/test/android-aar-consumer.sh

      - name: Record Android package consumer evidence
        run: |
          scripts/release/write-mobile-gate-evidence.sh \
            target/android/android-package-consumer.evidence \
            android-package-consumer

      - name: Upload Android AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aar-distribution
          path: |
            target/android/maven/**
            target/android/central/*.zip
            target/android/central/*.source
            target/android/android-package-consumer.evidence
          if-no-files-found: error

  ios-reproducible:
    name: iOS Reproducible Artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify iOS reproducibility
        run: scripts/release/reproducible-mobile-artifacts.sh ios

      - name: Record iOS reproducibility evidence
        run: |
          scripts/release/write-mobile-gate-evidence.sh \
            target/release-verification/reproducible-mobile/ios/pass-1/artifacts/ios-reproducibility.evidence \
            ios-reproducibility

      - name: Verify iOS package consumer
        run: |
          pkgid="$(cargo pkgid --manifest-path crates/aether-uniffi/Cargo.toml)"
          version="${pkgid##*#}"
          scripts/test/ios-package-consumer.sh "target/release-verification/reproducible-mobile/ios/pass-1/artifacts/Aether-v$version.swift-package.zip"

      - name: Record iOS package consumer evidence
        run: |
          scripts/release/write-mobile-gate-evidence.sh \
            target/release-verification/reproducible-mobile/ios/pass-1/artifacts/ios-package-consumer.evidence \
            ios-package-consumer

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: |
            target/release-verification/reproducible-mobile/ios/pass-1/artifacts/**
            target/release-verification/reproducible-mobile/ios/pass-1/SHA256SUMS
          if-no-files-found: error

  release-candidate-artifact-verification:
    name: Release Candidate Artifact Verification
    runs-on: ubuntu-latest
    needs:
      - android-reproducible
      - android-aar-distribution
      - ios-reproducible
      - sbom
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-artifacts
          path: target/release-candidate-verification/input/ios

      - name: Download Android release artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: target/release-candidate-verification/input/android

      - name: Download Android distribution
        uses: actions/download-artifact@v4
        with:
          name: android-aar-distribution
          path: target/release-candidate-verification/input/android-distribution

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: aether-uniffi-v${{ needs.sbom.outputs.version }}-sbom
          path: target/release-candidate-verification/input/sbom

      - name: Verify mobile release packet failure paths
        run: |
          scripts/test/mobile-release-packet.sh
          scripts/release/write-mobile-gate-evidence.sh \
            target/release-candidate-verification/input/evidence/mobile-release-packet.evidence \
            mobile-release-packet

      - name: Verify release-candidate artifact signatures and checksums
        env:
          AETHER_REQUIRE_GITHUB_GATE_EVIDENCE: "true"
        run: |
          scripts/test/release-candidate-artifact-verification.sh \
            target/release-candidate-verification/input/ios \
            target/release-candidate-verification/input/android \
            target/release-candidate-verification/input/android-distribution \
            target/release-candidate-verification/input/sbom \
            target/release-candidate-verification/input

      - name: Upload release-candidate verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-artifact-verification
          path: target/release-candidate-verification/evidence/**
          if-no-files-found: error

  signed-release:
    name: Signed Release Artifacts
    runs-on: ubuntu-latest
    needs:
      - release-preflight
      - sbom
      - constrained-decryption-budget
      - android-reproducible
      - android-aar-distribution
      - ios-reproducible
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-artifacts
          path: target/signed-release/input/ios

      - name: Download reproducible Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: target/signed-release/input/android

      - name: Download Android distribution
        uses: actions/download-artifact@v4
        with:
          name: android-aar-distribution
          path: target/signed-release/input/android-distribution

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: aether-uniffi-v${{ needs.sbom.outputs.version }}-sbom
          path: target/signed-release/input/sbom

      - name: Verify mobile release packet failure paths
        run: |
          scripts/test/mobile-release-packet.sh
          scripts/release/write-mobile-gate-evidence.sh \
            target/signed-release/input/evidence/mobile-release-packet.evidence \
            mobile-release-packet

      - name: Import release signing key
        env:
          AETHER_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AETHER_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$AETHER_RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "missing AETHER_RELEASE_GPG_PRIVATE_KEY" >&2
            exit 2
          fi

          export GNUPGHOME="$RUNNER_TEMP/aether-release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$AETHER_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Assemble signed mobile release packet
        env:
          AETHER_RELEASE_GPG_FINGERPRINT: ${{ secrets.AETHER_RELEASE_GPG_FINGERPRINT }}
          AETHER_RELEASE_GPG_PASSPHRASE: ${{ secrets.AETHER_RELEASE_GPG_PASSPHRASE }}
          AETHER_REQUIRE_SIGNED_MAVEN_PUBLICATION: "true"
          AETHER_REQUIRE_GITHUB_GATE_EVIDENCE: "true"
        run: |
          if [ -z "$AETHER_RELEASE_GPG_FINGERPRINT" ]; then
            echo "missing AETHER_RELEASE_GPG_FINGERPRINT" >&2
            exit 2
          fi
          if [ -z "$AETHER_RELEASE_GPG_PASSPHRASE" ]; then
            echo "missing AETHER_RELEASE_GPG_PASSPHRASE" >&2
            exit 2
          fi

          scripts/release/assemble-mobile-release-packet.sh \
            target/signed-release/input/ios \
            target/signed-release/input/android \
            target/signed-release/input/android-distribution \
            target/signed-release/input/sbom \
            target/signed-release/input \
            target/signed-release/release-assets

      - name: Verify final artifact failure paths
        env:
          AETHER_RELEASE_GPG_FINGERPRINT: ${{ secrets.AETHER_RELEASE_GPG_FINGERPRINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          packet="target/signed-release/release-assets"
          scripts/test/release-artifact-verification.sh \
            "$packet/Aether-v$version.xcframework.zip" \
            "$packet/aether-$version.aar" \
            "$packet/aether-v$version-release-key.asc"

      - name: Verify release gates
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release/verify-release-gates.sh

      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: target/signed-release/release-assets/**
          if-no-files-found: error

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release/publish-github-release.sh target/signed-release/release-assets
