name: Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

# A push supersedes the run before it, and the superseded run can only report on
# a commit nobody will merge. Grouping per pull request and cancelling keeps the
# runner off dead SHAs; on main the ref is the group, so pushes there still
# queue rather than cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests with Coverage
        run: cargo llvm-cov --workspace --no-report

      - name: Check roost-core Coverage
        run: cargo llvm-cov report -p roost-core --fail-under-lines 80

      - name: Check roost-crypto Coverage
        run: cargo llvm-cov report -p roost-crypto --fail-under-lines 80
