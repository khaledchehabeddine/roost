name: Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

jobs:
  coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests with Coverage
        run: cargo llvm-cov --workspace --no-report

      - name: Check aether-core Coverage
        run: cargo llvm-cov report -p aether-core --fail-under-lines 80

      - name: Check aether-crypto Coverage
        run: cargo llvm-cov report -p aether-crypto --fail-under-lines 80
