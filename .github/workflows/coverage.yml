name: Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

jobs:
  coverage:
    name: Line Coverage
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check hermes-crypto coverage
        run: |
          COV=$(cargo llvm-cov -p hermes-crypto --summary-only 2>&1 | grep TOTAL | awk '{print $10}' | tr -d '%')
          echo "hermes-crypto line coverage: ${COV}%"
          awk "BEGIN { exit ($COV < 80) ? 1 : 0 }" || { echo "::error::hermes-crypto coverage ${COV}% is below 80%"; exit 1; }

      - name: Check hermes-core coverage
        run: |
          COV=$(cargo llvm-cov -p hermes-core --summary-only 2>&1 | grep TOTAL | awk '{print $10}' | tr -d '%')
          echo "hermes-core line coverage: ${COV}%"
          awk "BEGIN { exit ($COV < 80) ? 1 : 0 }" || { echo "::error::hermes-core coverage ${COV}% is below 80%"; exit 1; }
