name: Fuzz Smoke

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

# A push supersedes the run before it, and the superseded run can only report on
# a commit nobody will merge. Grouping per pull request and cancelling keeps the
# runner off dead SHAs; on main the ref is the group, so pushes there still
# queue rather than cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    name: Cargo Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run fuzz smoke
        env:
          AETHER_FUZZ_RUNS: 64
          AETHER_FUZZ_TOOLCHAIN: nightly
        run: scripts/ci/fuzz-smoke.sh
