name: Publish verified mobile candidates

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full verified Roost main commit
        required: true
        type: string
      candidate_run:
        description: Signed preparation as run-id/attempt, manually installed and checked
        required: true
        type: string
      swift_run:
        description: Original roost-swift Package consumption run ID
        required: true
        type: string
      kotlin_run:
        description: Original roost-kotlin Package consumption run ID
        required: true
        type: string
      sha256_json:
        description: The same reviewed ZIP, AAR and POM SHA-256 pins used during preparation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-publication
  cancel-in-progress: false

env:
  ROOST_SOURCE_REVISION: ${{ inputs.source_revision }}
  ROOST_SWIFT_RUN: ${{ inputs.swift_run }}
  ROOST_KOTLIN_RUN: ${{ inputs.kotlin_run }}
  ROOST_SHA256_JSON: ${{ inputs.sha256_json }}
  ROOST_CANDIDATE_RUN: ${{ inputs.candidate_run }}

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'KhaledChehabeddine' &&
      github.triggering_actor == 'KhaledChehabeddine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify trusted candidate provenance, exact bytes, signatures and pins
        run: python3 scripts/release/mobile.py fetch target/mobile-candidate --run "$ROOST_CANDIDATE_RUN"
        env:
          GH_TOKEN: ${{ secrets.ROOST_READ_TOKEN }}
  publish:
    needs: verify
    if: >-
      github.actor == 'KhaledChehabeddine' &&
      github.triggering_actor == 'KhaledChehabeddine'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and reverify the same signed candidate
        run: python3 scripts/release/mobile.py fetch target/mobile-candidate --run "$ROOST_CANDIDATE_RUN"
        env:
          GH_TOKEN: ${{ secrets.ROOST_READ_TOKEN }}
      - name: Publish only missing destinations with unchanged bytes
        run: python3 scripts/release/mobile.py publish target/mobile-candidate
        env:
          GH_TOKEN: ${{ secrets.ROOST_PUBLISH_TOKEN }}
