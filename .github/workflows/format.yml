name: Format

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Cargo Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo Fmt
        run: cargo fmt --check --all
