name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Convert the binding docs
        run: |
          cargo build --locked -p roost-client
          for language in swift kotlin; do
            cargo run --locked --bin uniffi-bindgen -- generate target/debug/libroost_client.so \
              --language "$language" --no-format --out-dir "target/bindings/$language"
          done
          cargo run --locked --bin convert-docs -- swift target/bindings/swift/Roost.swift
          cargo run --locked --bin convert-docs -- kotlin \
            target/bindings/kotlin/com/chirp/roost/roost_client.kt
      - run: cargo doc --locked --workspace --no-deps --all-features
