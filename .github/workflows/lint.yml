name: Lint

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]

# A push supersedes the run before it, and the superseded run can only report on
# a commit nobody will merge. Grouping per pull request and cancelling keeps the
# runner off dead SHAs; on main the ref is the group, so pushes there still
# queue rather than cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Cargo Clippy
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
