# cargo-deny configuration — validates the dependency tree to catch security issues, disallowed licenses, and other
# policy violations.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
