[workspace]
members = [
    "crates/roost-core",
    "crates/roost-crypto",
    "crates/roost-client",
    "crates/roost-server",
    "crates/roost-protocol"
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.16.0"

[workspace.dependencies]
# Local
roost-core = { path = "crates/roost-core", version = "0.16.0" }
roost-crypto = { path = "crates/roost-crypto", version = "0.16.0" }
roost-protocol = { path = "crates/roost-protocol", version = "0.16.0" }
# Cryptography: these share digest 0.10 and rand_core 0.6, so bump them together
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2.0", features = ["fast", "zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.8.6"
rand_chacha = "0.3.1"
sha2 = "0.10.9"
x25519-dalek = "2.0.1"
# Cryptography utilities
blake3 = { version = "1.7.0", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = "1.8.2"
# Serialization
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
# Bindings
uniffi = "0.31.1"
# Text
unicode-normalization = "0.1.24"
# Testing
hex = "0.4.3"
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
new_without_default = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
