[workspace]
members = [
    "crates/aether-core",
    "crates/aether-crypto",
    "crates/aether-uniffi"
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.4.0"

[workspace.dependencies]
# Local
aether-core = { path = "crates/aether-core", version = "0.4.0" }
aether-crypto = { path = "crates/aether-crypto", version = "0.4.0" }
# Utility
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.8.6"
rand_chacha = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.8.2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
new_without_default = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
