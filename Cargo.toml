[workspace]
members = [
    "crates/hermes-core",
    "crates/hermes-crypto",
    "crates/hermes-transport-ble",
    "crates/hermes-uniffi"
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.3.0"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
new_without_default = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
