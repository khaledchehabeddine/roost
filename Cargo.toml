[workspace]
members = [
    "crates/roost-core",
    "crates/roost-crypto",
    "crates/roost-client",
    "crates/roost-server",
    "crates/roost-protocol"
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.16.0"

[workspace.dependencies]
# Local
roost-core = { path = "crates/roost-core", version = "0.16.0" }
roost-crypto = { path = "crates/roost-crypto", version = "0.16.0" }
roost-protocol = { path = "crates/roost-protocol", version = "0.16.0" }
# Utility
blake3 = { version = "=1.7.0", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2.0", features = ["fast", "zeroize"] }
hex = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
rand = "0.8.6"
rand_chacha = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
unicode-normalization = "0.1.24"
zeroize = "1.8.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
new_without_default = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
