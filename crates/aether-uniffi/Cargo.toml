[package]
name = "aether-uniffi"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "aether"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

[features]
default = []
fixture-replay = ["dep:blake3", "dep:hex", "dep:rand", "dep:rand_chacha", "dep:serde", "dep:serde_json"]

[dependencies]
# Local
aether-core.workspace = true
aether-crypto.workspace = true
# Utility
blake3 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uniffi = { version = "0.31.1", features = ["cli"] }
zeroize.workspace = true

[lints]
workspace = true
