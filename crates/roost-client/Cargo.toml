[package]
name = "roost-client"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "roost_client"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

[features]
default = []
development-certificates = ["roost-core/development-certificates"]

[dependencies]
# Local
roost-core.workspace = true
roost-protocol.workspace = true
# Utility
rand.workspace = true
thiserror.workspace = true
uniffi = { workspace = true, features = ["cli"] }
zeroize.workspace = true

[dev-dependencies]
roost-crypto.workspace = true

[lints]
workspace = true
