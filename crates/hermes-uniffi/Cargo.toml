[package]
name = "hermes-uniffi"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "hermes"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

[dependencies]
hermes-core = { path = "../hermes-core", version = "0.3.0" }
hermes-crypto = { path = "../hermes-crypto", version = "0.3.0" }
uniffi = { version = "0.31.1", features = ["cli"] }
zeroize = "1.8.2"

[lints]
workspace = true
