[package]
name = "hermes-uniffi"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "hermes"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
hermes-core = { path = "../hermes-core" }
uniffi = { version = "0.31.0", features = ["cli"] }
zeroize = "1"
