[package]
name = "hermes-uniffi"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "hermes"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

[dependencies]
hermes-core = { path = "../hermes-core", version = "0.3.0" }
hermes-crypto = { path = "../hermes-crypto", version = "0.3.0" }
uniffi = { version = "0.31.0", features = ["cli"] }
zeroize = "1.8.2"

[lints.rust]
missing_crate_level_docs = "warn"
missing_docs = "warn"
