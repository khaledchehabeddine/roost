[package]
name = "hermes-uniffi"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
# `rlib` lets doctests compile and run; FFI consumers use `cdylib` (Swift dylib) or
# `staticlib` (Android static link). Adding `rlib` does not change either FFI artifact.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "hermes"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

[dependencies]
hermes-core = { path = "../hermes-core", version = "0.3.0" }
hermes-crypto = { path = "../hermes-crypto", version = "0.3.0" }
uniffi = { version = "0.31.1", features = ["cli"] }
zeroize = "1.8.2"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
missing_crate_level_docs = "warn"
