[package]
name = "aether-crypto"
edition.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
# Dalek and KDF/MAC share digest 0.10 — bump together
# Dalek and rand share rand_core 0.6 — bump together
# Dalek
curve25519-dalek.workspace = true
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
# KDF/MAC
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
# Serialization
postcard.workspace = true
serde.workspace = true
# Utility
chacha20poly1305.workspace = true
rand = { workspace = true, features = ["getrandom"] }
subtle.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true

[lints]
workspace = true
