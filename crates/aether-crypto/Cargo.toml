[package]
name = "aether-crypto"
edition.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
# Dalek and KDF/MAC share digest 0.10 — bump together
# Dalek and rand share rand_core 0.6 — bump together
# Dalek
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
# KDF/MAC
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
# Serialization
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
# Utility
chacha20poly1305.workspace = true
rand = { workspace = true, features = ["getrandom"] }
subtle = "2.6.1"
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
rand_chacha.workspace = true
serde_json = "1.0.149"

[lints]
workspace = true
