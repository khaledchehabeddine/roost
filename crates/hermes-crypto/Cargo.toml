[package]
name = "hermes-crypto"
edition.workspace = true
version.workspace = true

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
# Pinned to 0.8.5 since dalek latest stable releases require rand_core 0.6
rand = { version = "0.8.5", features = ["getrandom"] }
zeroize = { version = "1.8.2", features = ["derive"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
hmac = "0.12.1"

[dev-dependencies]
hex = "0.4.3"
