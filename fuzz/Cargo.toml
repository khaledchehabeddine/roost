[package]
name = "roost-fuzz"
edition = "2024"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
roost-protocol = { path = "../crates/roost-protocol" }
roost-core = { path = "../crates/roost-core" }
roost-crypto = { path = "../crates/roost-crypto" }
hex = "0.4.3"
libfuzzer-sys = "0.4.12"
rand = "0.8.6"
rand_chacha = "0.3.1"

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_state_blob_decode"
path = "fuzz_targets/protocol_state_blob_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prekey_store_decode"
path = "fuzz_targets/prekey_store_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sender_certificate_validate"
path = "fuzz_targets/sender_certificate_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_frame_envelope_decode"
path = "fuzz_targets/sealed_frame_envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_payload_padding"
path = "fuzz_targets/sealed_payload_padding.rs"
test = false
doc = false
bench = false
